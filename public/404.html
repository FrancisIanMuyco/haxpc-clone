<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | PinoyPC</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0B1017;
      color: #F1F5F9;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      padding: 2rem;
    }
    h1 {
      font-size: 5rem;
      margin: 0;
      background: linear-gradient(135deg, #38BDF8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94A3B8;
      margin: 1rem 0 2rem;
    }
    a {
      color: #38BDF8;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      color: #0EA5E9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Page not found. The page you're looking for doesn't exist or has been moved.</p>
    <a href="/haxpc-clone/">Go back home</a>
  </div>
</body>
</html>
